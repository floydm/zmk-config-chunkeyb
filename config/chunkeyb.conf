# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Idle timeout before turning off backlight/displays (30 seconds in ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Inactivity timeout before entering deep sleep (15 minutes in ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable mouse emulation / pointing functionality
CONFIG_ZMK_POINTING=y
